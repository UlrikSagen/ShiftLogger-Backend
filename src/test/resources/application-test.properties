# Test profile. Datasource URL/user/password are injected by Testcontainers via
# @ServiceConnection; these placeholders only exist so the ${...} references in
# application.properties resolve without real env vars.
spring.datasource.username=test
spring.datasource.password=test
jwt.secret=integration-test-secret-not-used-anywhere-else-32b
logging.file.name=target/shiftlogger-test.log
logging.level.org.springframework.web=INFO